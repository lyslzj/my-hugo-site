{{ define "main" }}

<!-- 页面标题（复古双线框） -->
<div class="welcome">{{ cond (eq .Data.Singular "category") "栏 目" "标 签" }} · {{ .Title }}</div>

<!-- 文章列表 -->
<table class="list article-list">
    {{ range .Pages.ByDate.Reverse }}
    <tr>
        <td class="list-cat">{{ .Date | dateFormat "2006-01-02" }}:</td>
        <td class="list-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></td>
    </tr>
    {{ else }}
    <tr><td colspan="2" class="center-note">这里还什么都没有。</td></tr>
    {{ end }}
</table>

<p class="back-home"><a href="/">▷ 返回首页</a></p>

{{ end }}
