<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Title }} · {{ .Site.Title }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="stylesheet" href="/css/style.css">
<link href="/index.xml" rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}">
<script src="/js/auth.js" defer></script>
</head>
<body>
<div class="page">

    <!-- 导航条（与首页一致） -->
    <div class="menu-bar">
        <a href="/">网站首页</a>
        <a href="/posts/">全部日志</a>
        <a href="/memories/">忆昔岁月</a>
        <a href="/software/">软件集锦</a>
        <a href="/science/">冰花雪纹</a>
        <a href="/tech/">技术长廊</a>
        <a href="/life/">生活随笔</a>
        <a href="/works/">我的作品</a>
        <a href="/guestbook/">留言板</a>
        <a href="/profile/">关于本站</a>
    </div>

    <div id="gate-main">{{ block "main" . }}{{ end }}</div>

    <!-- 登录门禁提示（受保护栏目未登录时显示） -->
    <div id="gate-tip" style="display:none" class="form-box">
        <div class="welcome">该 栏 目 需 登 录 后 查 看</div>
        <p>此内容仅对登录用户开放，请先<a id="gate-login-link" href="/login.html">登录</a>，或前往<a href="/register.html">注册</a>一个账号。</p>
    </div>

    <!-- 页脚（年份自动更新） -->
    <div class="footer">
        Copyright &copy; 2026年1月-{{ now.Format "2006年1月" }} YiSen Liu. All rights reserved.
    </div>

</div>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
