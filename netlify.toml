[build]
  command = "hugo --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.167.0"

# 根目录的 functions/ 是给 Cloudflare Pages 用的，别让 Netlify 误当成它的函数目录
[functions]
  directory = "netlify/functions"

# 认证 API 部署在 Cloudflare Pages（whp），Netlify 这里做同源反代：
# 浏览器请求的是 www.lyslzj.eu.org/api/*，Cookie 属于一方 Cookie，不会被现代浏览器拦截。
# 注意：如果以后 Cloudflare 那边的域名变了，这里要同步修改。
[[redirects]]
  from = "/api/*"
  to = "https://whp.lyslzj.eu.org/api/:splat"
  status = 200
  force = true

# 受保护栏目也反代到 Cloudflare，由 Functions 做服务端门禁（未登录直接 302）
[[redirects]]
  from = "/software"
  to = "https://whp.lyslzj.eu.org/software/"
  status = 200
  force = true

[[redirects]]
  from = "/software/*"
  to = "https://whp.lyslzj.eu.org/software/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/works"
  to = "https://whp.lyslzj.eu.org/works/"
  status = 200
  force = true

[[redirects]]
  from = "/works/*"
  to = "https://whp.lyslzj.eu.org/works/:splat"
  status = 200
  force = true
