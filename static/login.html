<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户登录 · 我的个人博客</title>
<link rel="stylesheet" href="/css/style.css?v=20261014">
<script src="/js/auth.js" defer></script>
</head>
<body>
<div class="page">

    <!-- 导航条（与全站一致） -->
    <div class="menu-bar">
        <a href="/">网站首页</a>
        <a href="/posts/">全部日志</a>
        <a href="/memories/">忆昔岁月</a>
        <a href="/software/">软件集锦</a>
        <a href="/science/">冰花雪纹</a>
        <a href="/tech/">技术长廊</a>
        <a href="/life/">生活随笔</a>
        <a href="/works/">我的作品</a>
        <a href="/guestbook/">留言板</a>
        <a href="/profile/">关于本站</a>
    </div>

    <div class="welcome">用 户 登 录</div>

    <!-- 登录表单 -->
    <div class="form-box" id="login-box">
        <form id="login-form">
            <table class="form-table">
                <tr>
                    <td class="form-label">电子邮箱:</td>
                    <td><input type="email" id="login-email" size="26" placeholder="name@example.com"></td>
                </tr>
                <tr>
                    <td class="form-label">密&nbsp;&nbsp;码:</td>
                    <td><input type="password" id="login-pass" size="26"></td>
                </tr>
                <tr>
                    <td class="form-label">&nbsp;</td>
                    <td>
                        <input type="submit" value="登&nbsp;&nbsp;录">
                        <span style="margin-left:10px;">还没有账号？<a href="/register.html">去注册</a></span>
                        <span style="margin-left:10px;"><a href="javascript:void(0)" id="forgot-link">忘记密码？</a></span>
                    </td>
                </tr>
            </table>
        </form>
        <p class="form-note" id="login-msg"></p>
    </div>

    <!-- 忘记密码：重置邮箱 -->
    <div class="form-box" id="recover-box" style="display:none">
        <div class="welcome">重 置 密 码</div>
        <form id="recover-form">
            <table class="form-table">
                <tr>
                    <td class="form-label">电子邮箱:</td>
                    <td><input type="email" id="recover-email" size="26" placeholder="输入注册时的邮箱"></td>
                </tr>
                <tr>
                    <td class="form-label">&nbsp;</td>
                    <td><input type="submit" value="发送重置邮件"></td>
                </tr>
            </table>
        </form>
        <p class="form-note" id="recover-msg"></p>
        <p style="text-align:center;"><a href="javascript:void(0)" id="back-login">← 返回登录</a></p>
    </div>

    <div class="footer">
        Copyright &copy; <span id="year">2026年1月-2026年10月</span> YiSen Liu. All rights reserved.
    </div>
</div>

<script>
(function () {
    function getParam(name) {
        var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
        return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
    }
    var form = document.getElementById("login-form");
    var msg = document.getElementById("login-msg");
    form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("login-email").value.trim();
        var pass = document.getElementById("login-pass").value;
        if (!email || !pass) { msg.textContent = "请填写邮箱和密码。"; return; }
        msg.textContent = "登录中…";
        window.Auth.login(email, pass).then(function () {
            var redir = getParam("redirect");
            window.location.href = redir || "/";
        }).catch(function (err) {
            msg.textContent = window.Auth.errorText(err.message);
        });
    });

    /* 忘记密码：切换到重置邮箱视图 */
    var forgotLink = document.getElementById("forgot-link");
    if (forgotLink) {
        forgotLink.addEventListener("click", function () {
            document.getElementById("login-box").style.display = "none";
            document.getElementById("recover-box").style.display = "";
        });
    }
    var backLogin = document.getElementById("back-login");
    if (backLogin) {
        backLogin.addEventListener("click", function () {
            document.getElementById("recover-box").style.display = "none";
            document.getElementById("login-box").style.display = "";
        });
    }
    /* 发送重置密码邮件 */
    var recoverForm = document.getElementById("recover-form");
    if (recoverForm) {
        recoverForm.addEventListener("submit", function (e) {
            e.preventDefault();
            var email = document.getElementById("recover-email").value.trim();
            var rmsg = document.getElementById("recover-msg");
            if (!email) { rmsg.textContent = "请输入注册邮箱。"; return; }
            rmsg.textContent = "发送中…";
            window.Auth.recover(email).then(function () {
                rmsg.textContent = "重置邮件已发送到 " + email + "，请查收邮箱（注意垃圾箱），按邮件里的链接设置新密码后再登录。";
            }).catch(function (err) {
                rmsg.textContent = window.Auth.errorText(err.message);
            });
        });
    }
})();

document.getElementById("year").textContent = "2026年1月-" + new Date().getFullYear() + "年" + (new Date().getMonth() + 1) + "月";
</script>
</body>
</html>
