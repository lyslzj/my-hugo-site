<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户登录 · 我的个人博客</title>
<link rel="stylesheet" href="/css/style.css?v=20261028g">
<script src="/js/auth.js?v=20261028g" defer></script>
</head>
<body>
<div class="page">

    <!-- 导航条（与全站一致） -->
    <div class="menu-bar">
        <a href="/">网站首页</a>
        <a href="/posts/">全部日志</a>
        <a href="/memories/">忆昔岁月</a>
        <a href="/software/">软件集锦</a>
        <a href="/science/">冰花雪纹</a>
        <a href="/tech/">技术长廊</a>
        <a href="/life/">生活随笔</a>
        <a href="/works/">我的作品</a>
        <a href="/guestbook/">留言板</a>
        <a href="/profile/">关于本站</a>
    </div>

    <div class="welcome">用 户 登 录</div>

    <!-- 登录表单 -->
    <div class="form-box" id="login-box">
        <form id="login-form">
            <table class="form-table">
                <tr>
                    <td class="form-label">电子邮箱:</td>
                    <td><input type="email" id="login-email" size="26" placeholder="name@example.com"></td>
                </tr>
                <tr>
                    <td class="form-label">密&nbsp;&nbsp;码:</td>
                    <td><input type="password" id="login-pass" size="26"></td>
                </tr>
                <tr>
                    <td class="form-label">&nbsp;</td>
                    <td>
                        <input type="submit" value="登&nbsp;&nbsp;录">
                        <span style="margin-left:10px;">还没有账号？<a href="/register.html">去注册</a></span>
                        <span style="margin-left:10px;"><a href="javascript:void(0)" id="forgot-link">忘记密码？</a></span>
                    </td>
                </tr>
            </table>
        </form>
        <p class="form-note" id="login-msg"></p>

        <p style="text-align:center; margin: 16px 0 0;">
            <a class="btn btn-github" href="/api/auth/github"><svg class="gh-mark" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.7-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>使用 GitHub 登录</a>
        </p>
    </div>

    <!-- 忘记密码：重置邮箱 -->
    <div class="form-box" id="recover-box" style="display:none">
        <div class="welcome">重 置 密 码</div>
        <form id="recover-form">
            <table class="form-table">
                <tr>
                    <td class="form-label">电子邮箱:</td>
                    <td><input type="email" id="recover-email" size="26" placeholder="输入注册时的邮箱"></td>
                </tr>
                <tr>
                    <td class="form-label">&nbsp;</td>
                    <td><input type="submit" value="发送重置邮件"></td>
                </tr>
            </table>
        </form>
        <p class="form-note" id="recover-msg"></p>
        <p style="text-align:center;"><a href="javascript:void(0)" id="back-login">← 返回登录</a></p>
    </div>

    <div class="footer">
        Copyright &copy; <span id="year">2026年1月-2026年10月</span> YiSen Liu. All rights reserved.
    </div>
</div>

<script>
(function () {
    function getParam(name) {
        var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
        return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
    }
    var form = document.getElementById("login-form");
    var msg = document.getElementById("login-msg");

    /* 若已有登录态（刚通过 GitHub OAuth 回来），直接去目标页，别停在登录表单 */
    (function checkLoggedIn() {
        function goAfterLogin() {
            var redir = getParam("redirect");
            if (!redir || redir.charAt(0) !== "/" || redir.charAt(1) === "/" || redir.charAt(1) === "\\") {
                redir = "/";
            }
            location.href = redir;
        }
        if (!window.Auth || !Auth.refresh) {
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", checkLoggedIn);
            return;
        }
        Auth.refresh().then(function (user) { if (user) goAfterLogin(); });
    })();

    if (getParam("verified") === "1") {
        msg.textContent = "邮箱验证成功，请登录。";
    }

    form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("login-email").value.trim();
        var pass = document.getElementById("login-pass").value;
        if (!email || !pass) { msg.textContent = "请填写邮箱和密码。"; return; }
        msg.textContent = "登录中…";
        window.Auth.login(email, pass).then(function () {
            var redir = getParam("redirect");
            if (!redir || redir.charAt(0) !== "/" || redir.charAt(1) === "/" || redir.charAt(1) === "\\") {
                redir = "/";
            }
            window.location.href = redir;
        }).catch(function (err) {
            msg.textContent = window.Auth.errorText(err.message);
            if (err.code === "EMAIL_UNVERIFIED") {
                var resend = document.createElement("a");
                resend.href = "javascript:void(0)";
                resend.textContent = " 点此重新发送验证邮件";
                resend.addEventListener("click", function () {
                    msg.textContent = "发送中…";
                    window.Auth.resend(email).then(function (res) {
                        msg.textContent = res && res.sent
                            ? "验证邮件已重新发送，请查收邮箱。"
                            : "发送过于频繁或邮件服务未配置，请稍后再试。";
                    }).catch(function (e2) {
                        msg.textContent = window.Auth.errorText(e2.message);
                    });
                });
                msg.appendChild(resend);
            }
        });
    });

    /* 忘记密码：切换到重置邮箱视图 */
    var forgotLink = document.getElementById("forgot-link");
    if (forgotLink) {
        forgotLink.addEventListener("click", function () {
            document.getElementById("login-box").style.display = "none";
            document.getElementById("recover-box").style.display = "";
        });
    }
    var backLogin = document.getElementById("back-login");
    if (backLogin) {
        backLogin.addEventListener("click", function () {
            document.getElementById("recover-box").style.display = "none";
            document.getElementById("login-box").style.display = "";
        });
    }
    /* 发送重置密码邮件 */
    var recoverForm = document.getElementById("recover-form");
    if (recoverForm) {
        recoverForm.addEventListener("submit", function (e) {
            e.preventDefault();
            var email = document.getElementById("recover-email").value.trim();
            var rmsg = document.getElementById("recover-msg");
            if (!email) { rmsg.textContent = "请输入注册邮箱。"; return; }
            rmsg.textContent = "发送中…";
            window.Auth.recover(email).then(function (res) {
                if (res && res.mailer === false) {
                    rmsg.textContent = "站点尚未配置邮件服务，暂时无法发送重置邮件，请联系站长处理。";
                    return;
                }
                rmsg.textContent = "如果该邮箱已注册，重置邮件会发送到 " + email + "，请查收（注意垃圾箱），按邮件里的链接设置新密码后再登录。";
            }).catch(function (err) {
                rmsg.textContent = window.Auth.errorText(err.message);
            });
        });
    }
})();

document.getElementById("year").textContent = "2026年1月-" + new Date().getFullYear() + "年" + (new Date().getMonth() + 1) + "月";
</script>
</body>
</html>
