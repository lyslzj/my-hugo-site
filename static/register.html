<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户注册 · 我的个人博客</title>
<link rel="stylesheet" href="/css/style.css?v=20261014">
<script src="/js/auth.js" defer></script>
</head>
<body>
<div class="page">

    <!-- 导航条（与全站一致） -->
    <div class="menu-bar">
        <a href="/">网站首页</a>
        <a href="/posts/">全部日志</a>
        <a href="/memories/">忆昔岁月</a>
        <a href="/software/">软件集锦</a>
        <a href="/science/">冰花雪纹</a>
        <a href="/tech/">技术长廊</a>
        <a href="/life/">生活随笔</a>
        <a href="/works/">我的作品</a>
        <a href="/guestbook/">留言板</a>
        <a href="/profile/">关于本站</a>
    </div>

    <div class="welcome">用 户 注 册</div>

    <!-- 注册表单 -->
    <div class="form-box">
        <form id="register-form">
            <table class="form-table">
                <tr>
                    <td class="form-label">电子邮箱:</td>
                    <td><input type="email" id="reg-email" size="26" placeholder="name@example.com"></td>
                </tr>
                <tr>
                    <td class="form-label">密&nbsp;&nbsp;码:</td>
                    <td><input type="password" id="reg-pass" size="26" placeholder="至少 8 位"></td>
                </tr>
                <tr>
                    <td class="form-label">确认密码:</td>
                    <td><input type="password" id="reg-pass2" size="26"></td>
                </tr>
                <tr>
                    <td class="form-label">昵&nbsp;&nbsp;称:</td>
                    <td><input type="text" id="reg-name" size="26" placeholder="登录后显示的名称"> <span class="opt-note">（选填）</span></td>
                </tr>
                <tr>
                    <td class="form-label">&nbsp;</td>
                    <td>
                        <input type="submit" value="提交注册">
                        <input type="reset" value="重新填写">
                        <span style="margin-left:10px;">已有账号？<a href="/login.html">去登录</a></span>
                    </td>
                </tr>
            </table>
            <div id="turnstile-slot" style="margin:10px 0;"></div>
        </form>
        <p class="form-note" id="reg-msg"></p>
    </div>

    <div class="footer">
        Copyright &copy; <span id="year">2026年1月-2026年10月</span> YiSen Liu. All rights reserved.
    </div>
</div>

<script>
(function () {
    var form = document.getElementById("register-form");
    var msg = document.getElementById("reg-msg");
    form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("reg-email").value.trim();
        var pass = document.getElementById("reg-pass").value;
        var pass2 = document.getElementById("reg-pass2").value;
        var name = document.getElementById("reg-name").value.trim();

        if (!email || !pass || !pass2) { msg.textContent = "请填写邮箱和密码。"; return; }
        if (pass !== pass2) { msg.textContent = "两次输入的密码不一致。"; return; }
        if (pass.length < 8) { msg.textContent = "密码至少 8 位。"; return; }

        msg.textContent = "提交中…";
        window.Auth.signup(email, pass, { full_name: name }, window.Auth.turnstileToken()).then(function (res) {
            if (res && res.verifyRequired) {
                if (res.mailSent === false) {
                    msg.textContent = "注册成功，但验证邮件发送失败。请到登录页登录时点击“重新发送验证邮件”，或联系站长。";
                } else {
                    msg.textContent = "注册成功！验证邮件已发送到 " + email + "，请查收并点击链接完成验证（注意垃圾箱），验证后会自动登录。";
                }
            } else {
                msg.textContent = "注册成功，现在可以登录了。";
            }
        }).catch(function (err) {
            msg.textContent = window.Auth.errorText(err.message);
        });
    });
    window.addEventListener("load", function () {
        if (window.Auth && window.Auth.mountTurnstile) {
            window.Auth.mountTurnstile(document.getElementById("turnstile-slot"));
        }
    });
})();

document.getElementById("year").textContent = "2026年1月-" + new Date().getFullYear() + "年" + (new Date().getMonth() + 1) + "月";
</script>
</body>
</html>
