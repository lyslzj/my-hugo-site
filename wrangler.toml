# Cloudflare Pages 配置（D1 绑定 + 构建参数）
# 说明：Git 集成部署时，D1 绑定请在控制台 Settings → Functions → D1 database bindings 里再绑一次；
#      用 `wrangler pages deploy public` 直传时，这个文件里的绑定会生效。
name = "myblog"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

[vars]
# 登录态 Cookie 只设在 Cloudflare 这个域名上（Netlify 主站不需要登录）
COOKIE_DOMAIN = "whpljy.eu.org"
# 邮件里链接的兜底域名（注册时优先用请求的 Origin）
SITE_URL = "https://whpljy.eu.org"
# 允许的跨源（Cloudflare 站自身 + 预览域）
ALLOWED_ORIGINS = "https://whpljy.eu.org,https://www.whpljy.eu.org,https://myblog-1a2.pages.dev"
# PBKDF2-SHA256 迭代次数。免费版 10ms CPU 限制下建议 100000；付费版可提到 210000
PBKDF2_ITERATIONS = "100000"

[[d1_databases]]
binding = "DB"
database_name = "myblog-auth"
database_id = "31385e45-5c9f-4229-b653-0e9c83b80bd2"
