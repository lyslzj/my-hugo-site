<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>{{ .Site.Title }}</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><a href="/">{{ .Site.Title }}</a></h1>
        </header>
        <main>
            {{ block "main" . }}
            {{ end }}
        </main>
        <footer>
            <p>&copy; {{ now.Year }} {{ .Site.Title }}</p>
        </footer>
    </div>
</body>
</html>
