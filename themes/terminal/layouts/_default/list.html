{{ define "main" }}
  <div class="container">
    <h2 class="header">文章列表</h2>
    <ul class="posts">
      {{ range .Data.Pages }}
      <li class="post">
        <time class="time">{{ .Date.Format "2006-01-02" }}</time>
        <h3 class="title"><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
      </li>
      {{ end }}
    </ul>
  </div>
{{ end }}
